[project]
name = "mip"
version = "0.0.1"
description = "Local coding assistant: OpenAI-compatible API over Ollama, with project-aware RAG."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "qdrant-client>=1.12",
  "apscheduler>=3.10",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
chunkers = [
  "tree-sitter>=0.23",
  "tree-sitter-typescript>=0.23",
]
dev = [
  "ruff>=0.7",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mip"]

[tool.ruff]
line-length = 100
target-version = "py311"
